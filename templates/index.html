<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>벼락치기 한계 계산기</title>
  <style>
    :root {
      --bg1: #f7efe3;
      --bg2: #d9e7f5;
      --ink: #202225;
      --brand: #0f766e;
      --card: #ffffffcc;
      --warn: #d97706;
      --danger: #b91c1c;
    }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 20%, var(--bg1), transparent 55%), radial-gradient(circle at 80% 0%, var(--bg2), transparent 40%), #f4f4f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(860px, 100%);
      background: var(--card);
      backdrop-filter: blur(4px);
      border: 1px solid #ffffff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 16px 34px #00000012;
    }
    h1 { margin: 0 0 4px; }
    p { margin: 0 0 16px; }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label { font-size: 14px; font-weight: 600; }
    input, select, button {
      margin-top: 6px;
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #d6d6d6;
      font-size: 14px;
      box-sizing: border-box;
    }
    .full { grid-column: 1 / -1; }
    button {
      background: var(--brand);
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 760px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>벼락치기 한계 계산기</h1>
    <p>최대 미루기 일수와 리스크를 계산하고, 현실적인 단기 플랜을 제안합니다.</p>

    <form action="/analyze" method="post">
      <div>
        <label>시험 이름</label>
        <input name="exam_name" placeholder="TOEIC / JLPT N2 / 한국사" required />
      </div>
      <div>
        <label>시험 날짜</label>
        <input type="date" name="exam_date" required />
      </div>
      <div>
        <label>현재 점수(또는 등급 수치화)</label>
        <input type="number" step="0.1" name="baseline_score" value="50" required />
      </div>
      <div>
        <label>목표 점수(또는 목표 수치)</label>
        <input type="number" step="0.1" name="target_score" value="80" required />
      </div>
      <div>
        <label>현재 진도율(%)</label>
        <input type="number" step="1" min="0" max="100" name="progress_pct" value="30" required />
      </div>
      <div>
        <label>평일 하루 공부 가능 시간</label>
        <input type="number" step="0.5" name="weekday_hours" value="2" required />
      </div>
      <div>
        <label>주말 하루 공부 가능 시간</label>
        <input type="number" step="0.5" name="weekend_hours" value="4" required />
      </div>
      <div>
        <label>벼락치기 내성(1 낮음 ~ 5 높음)</label>
        <select name="cram_tolerance">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="full">
        <button type="submit">미루기 한계 계산하기</button>
      </div>
    </form>
  </section>
</body>
</html>
